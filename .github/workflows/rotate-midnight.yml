name: Rotate incidents (midnight Berlin)

on:
  schedule:
    - cron: '0 22 * * *'  # 00:00 CET = 22:00 UTC (winter) / 21:00 UTC (summer)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Configure Git
        run: |
          git config user.name "dsix-bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Pull latest
        run: git pull --rebase origin main || true
      - name: Rotate incidents
        run: python -m src.rotate_incidents
      - name: Commit
        run: |
          git add docs/data/*.json
          git diff --quiet --cached || git commit -m "Midnight rotation [skip ci]"
          git push origin main