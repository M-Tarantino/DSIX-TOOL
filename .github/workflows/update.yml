name: Update Security Index and Backlog

on:
  schedule:
    - cron: '0 * * * *' # Läuft stündlich (oder entsprechend deiner bisherigen Konfiguration)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run analysis and backlog processing
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python main.py

      - name: Commit and push changes
        run: |
          git config user.name "dsix-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main || git rebase --abort
          git add docs/data/*.json
          git diff --quiet --cached || git commit -m "Update security index and backlog [skip ci]"
          git push origin main
