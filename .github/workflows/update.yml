name: Update Security Index

on:
  schedule:
    - cron: '0 */3 * * *' # Every 3 hours (adjust as needed)
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Configure Git Identity
        run: |
          git config user.name "dsix-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Pull latest changes
        run: git pull --rebase origin main

      - name: Run pipeline
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'groq' }}
          FILTER_BACKEND: ${{ vars.FILTER_BACKEND || 'keyword' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m src.pipeline
        
      - name: Commit and push changes
        run: |
          git add docs/data/*.json
          git diff --quiet --cached || git commit -m "Update security index [skip ci]"
          git pull --rebase origin main
          git push origin main
