name: Deep security search (12h)

on:
  schedule:
   # - cron: '0 */12 * * *'  # Every 12 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deep-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run deep search
        env:
          LLM_PROVIDER: groq
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m src.deep_search

      - name: Cleanup old incidents
        run: python -m src.cleanup

      - name: Configure Git Identity
        run: |
          git config user.name "dsix-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Commit changes
        run: |
          git pull --rebase origin main || true
          git add docs/data/*.json
          git diff --quiet --cached || git commit -m "Deep search + cleanup [skip ci]"
          git push origin main
