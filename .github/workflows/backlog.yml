name: Seed backlog (cold start)

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Re-run even if incidents.json already has entries"
        type: boolean
        default: false
      window_days:
        description: "How many days back to reconstruct"
        type: number
        default: 60

permissions:
  contents: write

jobs:
  backlog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Generate backlog
        env:
          LLM_PROVIDER: groq
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          ARGS="--window-days ${{ inputs.window_days }}"
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python -m src.backlog $ARGS

      - name: Configure Git Identity
        run: |
          git config user.name "dsix-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Commit seeded data
        run: |
          git pull --rebase origin main || true
          git add docs/data/*.json
          git diff --quiet --cached || git commit -m "Seed retroactive backlog [skip ci]"
          git push origin main
